# ====== SEED ======
seed: 42

# ====== DATA & FEATURE ENGINEERING ======
data:
  image_dir: "E:\\Cellula_Technologies\\Project2\\water_segmentation\\data\\raw\\images"
  label_dir: "E:\\Cellula_Technologies\\Project2\\water_segmentation\\data\\raw\\labels"
  split_dir: "E:\\Cellula_Technologies\\Project2\\water_segmentation\\data\\splits"
  stats_file: "E:\\Cellula_Technologies\\Project2\\water_segmentation\\data\\statistics\\train_stats.json"
  feature_engineering: true
  engineered_stats_file: "E:\\Cellula_Technologies\\Project2\\water_segmentation\\data\\statistics\\engineered_train_stats.json"
  norm_method: "zscore"  # Dataset-wise per-channel normalization strictly from train split
  band_indices: null     # All 12 engineered hydrological features

# ====== SPLIT ======
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  group_bucket_size: 10

# ====== PREPROCESSING ======
preprocessing:
  nodata_values: {8: -9999}
  nodata_fill: "train_mean"

# ====== AUGMENTATION ======
augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.5
  random_rotation_90: 0.5

# ====== MODEL OPTIMIZATION: SE-Res-UNet ======
model:
  name: "se_res_unet"    # Squeeze-and-Excitation Residual U-Net
  in_channels: 12        # 12 engineered hydrological & spectral channels
  out_channels: 1
  base_channels: 32
  norm_type: "group"     # GroupNorm (robust for satellite batches)
  num_groups: 8
  reduction: 16          # Channel attention compression ratio

# ====== LOSS ======
loss:
  name: "bce_dice"
  bce_weight: 0.5
  dice_weight: 0.5
  smooth: 1.0

# ====== TRAINING ======
training:
  optimizer: "adamw"
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  batch_size: 8
  num_workers: 0
  max_epochs: 100
  
  # Scheduler
  scheduler: "reduce_on_plateau"
  scheduler_patience: 5
  scheduler_factor: 0.5
  scheduler_min_lr: 1.0e-6
  
  # Early stopping
  early_stopping_patience: 12
  early_stopping_metric: "water_iou_global"
  early_stopping_mode: "max"

# ====== CHECKPOINT ======
checkpoint:
  save_dir: "water_segmentation/checkpoints/final_model_engineered"
  save_best_only: true
  monitor: "water_iou_global"
  mode: "max"

# ====== EVALUATION ======
evaluation:
  threshold: 0.5
  threshold_search: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70]
